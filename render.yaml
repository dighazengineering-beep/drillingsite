# Render blueprint for the Dighaz Engineering Limited API and database.
# The website itself is hosted on Vercel (see vercel.json). Nothing here is shared with any other company.
databases:
  - name: dighaz-engineering-db
    plan: free
    databaseName: dighaz
    user: dighaz

services:
  - type: web
    name: dighaz-engineering-api
    runtime: node
    plan: free
    # The push step creates the database tables on the first deploy; it is safe to run again.
    buildCommand: npm install -g pnpm && pnpm install --no-frozen-lockfile && pnpm --filter @workspace/db run push-force && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: dighaz-engineering-db
          property: connectionString
      # The password for /admin. Type a strong one in the Render dashboard.
      - key: ADMIN_KEY
        sync: false
      # Signs member log-ins. Render makes a random value for you.
      - key: MEMBER_SECRET
        generateValue: true
      # Optional: Google sign-in for members.
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Optional: Cloudinary, for videos posted from /admin.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Optional: store videos in this GitHub repo instead of Cloudinary.
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: GITHUB_BRANCH
        value: main
