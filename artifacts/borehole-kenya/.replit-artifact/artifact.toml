kind = "web"
previewPath = "/"
title = "Borehole Drilling Services Kenya"
version = "1.0.0"
id = "artifacts/borehole-kenya"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20447

[services.development]
run = "pnpm --filter @workspace/borehole-kenya run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/borehole-kenya", "run", "build" ]
publicDir = "artifacts/borehole-kenya/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20447"
BASE_PATH = "/"
